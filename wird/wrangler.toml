# Réglages de publication de Wird (npx wrangler deploy)
name = "wird"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Base de données « wird » (créée sur le compte Cloudflare)
[[d1_databases]]
binding = "DB"
database_name = "wird"
database_id = "33009124-9056-4912-a378-1e2a37491981"

# Rappels de prière : le Worker se réveille chaque minute
[triggers]
crons = ["* * * * *"]
